<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Legal Case MS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <main>

    <p class="section-title">Contact Us</p>
    <p class="section-sub">We're here to help. Reach out and we'll respond within 24 hours.</p>

    <div class="two-column">

      <div style="display:flex; flex-direction:column; gap:16px">
        <div class="card">
          <span class="card-icon"></span>
          <h3>Our Office</h3>
          <p>KG 7 Ave, Kigali, Rwanda</p>
        </div>
        <div class="card">
          <span class="card-icon"></span>
          <h3>Phone</h3>
          <p>+250 786 999 221</p>
        </div>
        <div class="card">
          <span class="card-icon"></span>
          <h3>Email</h3>
          <p>info@legalcasemanagementsystem.com</p>
        </div>
        <div class="card">
          <span class="card-icon"></span>
          <h3>Working Hours</h3>
          <p>Monday – Friday: 8:00 AM – 5:00 PM</p>
        </div>
      </div>

      <form class="form-card" id="contactForm" novalidate>
        <h2>Send a Message</h2>
        <p class="form-sub">We'll get back to you as soon as possible.</p>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Your full name" required minlength="3">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@gmail.com" required>

        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="">-- Choose a subject --</option>
          <option>Book a consultation</option>
          <option>Technical support</option>
          <option>Other</option>
        </select>

        <label for="messageText">Message</label>
        <textarea id="messageText" name="messageText" rows="5" placeholder="How can we help you?" required minlength="10"></textarea>

        <p id="errorMessage" class="error-text" style="display:none"></p>
        <p id="successMessage" class="success-text" style="display:none"></p>

        <button type="submit" class="btn-primary">Send Message</button>
      </form>

    </div>

  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { renderHeader, renderFooter } from "../controller/nav.js";
    renderHeader();
    renderFooter();
  </script>
  <script src="../controller/contact.js"></script>

</body>
</html>
