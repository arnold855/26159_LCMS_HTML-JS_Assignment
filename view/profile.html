<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – Legal Case MS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <main>

    <div class="section-header">
      <h2>My Profile</h2>
      <span class="section-badge" id="profileBadge">User</span>
    </div>

    <div class="profile-card">
      <div class="profile-avatar" id="profileAvatar">?</div>

      <div class="profile-row">
        <span class="profile-label">Full Name</span>
        <span class="profile-value" id="profileName">—</span>
      </div>
      <div class="profile-row">
        <span class="profile-label">Email</span>
        <span class="profile-value" id="profileEmail">—</span>
      </div>
      <div class="profile-row">
        <span class="profile-label">Phone</span>
        <span class="profile-value" id="profilePhone">—</span>
      </div>
      <div class="profile-row">
        <span class="profile-label">Role</span>
        <span class="profile-value" id="profileRole">—</span>
      </div>
      <div class="profile-row">
        <span class="profile-label">Account ID</span>
        <span class="profile-value" id="profileId">—</span>
      </div>
    </div>

    <p style="margin-top:20px">
      <a href="javascript:history.back()" style="color:var(--navy);font-weight:bold;">Back to Dashboard</a>
    </p>

  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { renderHeader, renderFooter } from "../controller/nav.js";
    renderHeader();
    renderFooter();
  </script>
  <script src="../controller/profile.js"></script>

</body>
</html>
